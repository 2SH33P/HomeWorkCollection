name: build

# push 到 main      : 只编译 + 上传 Actions 产物（Artifacts），不发布任何东西。
# 打 tag（例：v1.0）: 编译 + 自动创建 GitHub Release，附件 + **自动生成的「更新内容」**。
# 手动触发（Run workflow）: 同 push main（只出 Artifacts）。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: >-
          python -m pip install --upgrade pip pyinstaller fastapi "uvicorn[standard]"
          python-multipart pillow opencv-python-headless numpy typst
      - name: Build exe
        run: >-
          python -m PyInstaller --noconfirm --onefile --name HomeWorkCollection
          --add-data "tools/crop-tool/static;static"
          --collect-all typst
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          tools/crop-tool/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: HomeWorkCollection-windows
          if-no-files-found: error
          path: |
            dist/HomeWorkCollection.exe
            fonts/
            typst-packages/
            README-Windows.txt

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: >-
          python -m pip install --upgrade pip pyinstaller fastapi "uvicorn[standard]"
          python-multipart pillow opencv-python-headless numpy typst
      - name: Build binary
        run: >-
          python -m PyInstaller --noconfirm --onefile --name HomeWorkCollection
          --add-data "tools/crop-tool/static:static"
          --collect-all typst
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          tools/crop-tool/app.py
      - name: Package (binary + fonts + typst packages)
        run: |
          ARCH=$(uname -m)
          mkdir -p pkg/HomeWorkCollection
          cp dist/HomeWorkCollection pkg/HomeWorkCollection/
          cp -r fonts typst-packages pkg/HomeWorkCollection/
          chmod +x pkg/HomeWorkCollection/HomeWorkCollection
          cd pkg
          zip -r "../HomeWorkCollection-macos-${ARCH}.zip" HomeWorkCollection
          echo "ARTIFACT=HomeWorkCollection-macos-${ARCH}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeWorkCollection-macos-${{ runner.arch }}
          if-no-files-found: error
          path: ${{ env.ARTIFACT }}

  # 只有推 tag（v1.0 这类）才会跑：整理产物 + 自动写「更新内容」+ 发 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # 需要完整历史 + tag，才能算出"上次发版到现在"的更新内容
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Package release assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # Windows: 把 exe 提到压缩包根目录（和 fonts / typst-packages 同级，解压即用）
          cd dl/HomeWorkCollection-windows
          if [ -d dist ]; then mv dist/HomeWorkCollection.exe . ; rmdir dist ; fi
          zip -qr "../../out/HomeWorkCollection-${VER}-windows.zip" .
          cd ../..
          # macOS: 产物本身就是 zip（内含可执行文件 + fonts + typst-packages）
          for f in dl/HomeWorkCollection-macos-*/*.zip; do
            arch="$(basename "$(dirname "$f")" | sed 's/.*macos-//' | tr 'A-Z' 'a-z')"
            cp "$f" "out/HomeWorkCollection-${VER}-macos-${arch}.zip"
          done
          ls -lh out
      - name: Build release notes
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          PREV="$(git tag --sort=-v:refname | grep -vx "${GITHUB_REF_NAME}" | head -n1 || true)"
          {
            echo "## 错题收集工具 ${GITHUB_REF_NAME}"
            echo
            echo "### 更新内容"
            if [ -n "$PREV" ]; then
              echo "_（相对上一个版本 ${PREV}）_"
              echo
              git log --no-merges --pretty=format:'- %s' "${PREV}..${GITHUB_REF_NAME}"
            else
              echo
              git log --no-merges --max-count=30 --pretty=format:'- %s' "${GITHUB_REF_NAME}"
            fi
            echo
            echo
            echo "### 用法"
            echo '把下载的压缩包**完整解压**到一个目录（可执行文件必须和 `fonts/`、`typst-packages/` 在同一目录），'
            echo 'Windows 双击 `HomeWorkCollection.exe`；macOS 先 `chmod +x HomeWorkCollection` 再运行；'
            echo '然后浏览器打开 <http://localhost:8091>（手机同一 WiFi 访问 `http://电脑IP:8091`）。'
            echo
            echo "| 附件 | 内容 |"
            echo "|---|---|"
            echo "| \`HomeWorkCollection-${VER}-windows.zip\` | 单文件 exe + 内置字体 + Typst 包 |"
            echo "| \`HomeWorkCollection-${VER}-macos-*.zip\` | macOS 可执行文件（Apple Silicon）+ 内置字体 + Typst 包 |"
            echo
            echo '**数据存在哪**：就在可执行文件所在目录（`library.json`、`items/`、`pages/`、`backups/`…），升级时只替换可执行文件即可，数据不动。'
            echo
            echo '📖 使用教程：<https://2sh33p.github.io/HomeWorkCollection/>'
          } > RELEASE_NOTES.md
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: 错题收集工具 ${{ github.ref_name }}
          prerelease: false
          overwrite_files: true          # 同版本重发时覆盖同名附件
          generate_release_notes: false  # 更新内容由上面的步骤自动生成，不用 GitHub 默认列表
          fail_on_unmatched_files: true
          files: out/*
          body_path: RELEASE_NOTES.md
